:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --ink:#171A2B; --muted:#646A84; --line:#E3E6EF; --neutral:#E9EBF2; --ctx:#D8DCE8;
  --brand:#6B4EF5; --star:#F5A300;
  --accent:#6B4EF5; --tint:#ECE8FF; --ghost:#DAD3FF;
  --shadow:0 1px 2px rgba(23,26,43,.05),0 10px 28px rgba(23,26,43,.08);
  --shadow-sm:0 1px 2px rgba(23,26,43,.06),0 4px 12px rgba(23,26,43,.06);
  --hdr:64px;
  --bn:"HS","Hind Siliguri","Noto Sans Bengali","Kohinoor Bangla","Nirmala UI",system-ui,sans-serif;
}
.lv0{--accent:#F08C00;--tint:#FFF1DB;--ghost:#FFDFAE}
.lv1{--accent:#F43F78;--tint:#FFE4EC;--ghost:#FFCBDA}
.lv2{--accent:#6B4EF5;--tint:#ECE8FF;--ghost:#DAD3FF}
.lv3{--accent:#1790E6;--tint:#E0F0FE;--ghost:#C2E2FC}
.lv4{--accent:#0FA674;--tint:#DDF7EE;--ghost:#BBEEDC}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E1017;--surface:#1A1D2A;--ink:#F1F2F8;--muted:#A0A6BE;--line:#2B2F41;--neutral:#262A3A;--ctx:#353A4D;--brand:#7C63F7;
    --accent:#8E78FF;--tint:#25204A;--ghost:#3A3180;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);--shadow-sm:0 1px 2px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3)}
  .lv0{--accent:#FFAA2B;--tint:#35270F;--ghost:#5C4216}
  .lv1{--accent:#FF6B98;--tint:#3A1926;--ghost:#662540}
  .lv2{--accent:#8E78FF;--tint:#25204A;--ghost:#3A3180}
  .lv3{--accent:#4FB0F5;--tint:#11293D;--ghost:#1B4467}
  .lv4{--accent:#3DCB9A;--tint:#102F26;--ghost:#1A4F40}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--bn);font-size:17px;line-height:1.5;
  overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
svg{display:block}
[hidden]{display:none!important}
.ic{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sk{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:7}
.press{transition:transform .12s ease}
.press:active{transform:scale(.95)}

/* ---------- shell ---------- */
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bar{height:var(--hdr);flex:none;display:flex;align-items:center;gap:12px;padding:0 16px}
.bar h1{font-size:21px;line-height:1.25;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:46px;height:46px;flex:none;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm);display:grid;place-items:center;font-size:24px;line-height:1}
.round svg{width:22px;height:22px}
.screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:enter .22s ease}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
.wrap{max-width:760px;margin:0 auto;padding:4px 16px 32px}

/* ---------- writing pad ---------- */
.pad{position:relative;aspect-ratio:1;border-radius:32px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.pad::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--line) 1.3px,transparent 1.5px);background-size:22px 22px;background-position:11px 11px}
.pad>svg{position:absolute;inset:0;width:100%;height:100%}
.cx path{stroke:var(--ctx)}
.ghost path{stroke:var(--ghost)}
.done path{stroke:var(--ink)}

/* ---------- home ---------- */
#home{display:grid;place-items:center;padding:16px;position:relative}
.hero{display:grid;justify-items:center;text-align:center;width:100%}
.orb{position:relative;width:min(64vw,36vh,300px)}
.orb::before{content:"";position:absolute;inset:-14%;border-radius:50%;
  background:conic-gradient(from 210deg,#6B4EF5,#F43F78,#F5A300,#0FA674,#1790E6,#6B4EF5);filter:blur(38px);opacity:.34}
.orb .pad{border-radius:38px}
.orb .done path{stroke:url(#hg)}
.hero h2{font-size:clamp(46px,13vw,78px);line-height:1.2;margin:clamp(18px,4vh,34px) 0 0;font-weight:600}
.hero p{margin:2px 0 0;font-size:clamp(17px,4.5vw,21px);color:var(--muted)}
.cta{margin-top:clamp(20px,4vh,34px);height:64px;padding:0 34px 0 28px;border-radius:32px;background:var(--brand);color:#fff;
  display:inline-flex;align-items:center;gap:12px;font-size:22px;font-weight:600;box-shadow:0 10px 24px rgba(107,78,245,.36)}
.cta svg{width:22px;height:22px}
.gate{position:absolute;top:12px;right:16px;height:42px;padding:0 16px 0 12px;border-radius:21px;background:var(--surface);box-shadow:var(--shadow-sm);
  display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);overflow:hidden;isolation:isolate}
.gate::before{content:"";position:absolute;inset:0;background:var(--tint);transform:scaleX(0);transform-origin:left;z-index:-1}
.gate.holding::before{transition:transform 1.5s linear;transform:scaleX(1)}
.gate svg{width:18px;height:18px}

/* ---------- who ---------- */
.lead{font-size:clamp(26px,7vw,34px);line-height:1.25;font-weight:600;margin:8px 0 18px}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:560px}
.ava{border-radius:24px;background:var(--surface);box-shadow:var(--shadow-sm);padding:16px 6px 12px;display:grid;justify-items:center;gap:4px}
.ava .e{width:clamp(64px,19vw,92px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(36px,11vw,54px);line-height:1;background:var(--tint)}
.ava b{font-size:18px;font-weight:600;line-height:1.3}
.ava small{font-size:14px;color:var(--muted);min-height:21px}
.ava small i,.cnt i{font-style:normal;color:var(--star)}
.ava[aria-current="true"]{box-shadow:0 0 0 3px var(--brand),var(--shadow-sm)}

/* ---------- levels ---------- */
.levels{display:grid;gap:12px}
.lvl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:14px 16px 14px 14px;border-radius:26px;background:var(--surface);box-shadow:var(--shadow-sm)}
.lvl .sq{width:84px;aspect-ratio:1;border-radius:24px;background:var(--tint)}
.lvl .sq svg{width:100%;height:100%}
.lvl .sq .sk{stroke:var(--accent);stroke-width:8}
.lvl .sq .cx .sk{stroke:var(--ghost)}
.lvl b{display:block;font-size:22px;font-weight:600;line-height:1.3}
.lvl .sub{display:block;font-size:15px;color:var(--muted)}
.meter{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:8px}
.meter div{height:8px;border-radius:4px;background:var(--neutral);overflow:hidden}
.meter div i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.cnt{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lvl>svg{width:20px;height:20px;color:var(--muted)}
@media (min-width:700px){.levels{grid-template-columns:1fr 1fr}}

/* ---------- letter grid ---------- */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));max-width:900px;margin:0 auto;padding:4px 16px 32px}
.tile{background:var(--surface);border-radius:20px;padding:2px 2px 10px;box-shadow:var(--shadow-sm);display:grid;justify-items:center}
.tile svg{width:100%;aspect-ratio:1}
.tile .sk{stroke:var(--ink);stroke-width:7.5}
.tile .cx .sk{stroke:var(--ctx)}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--neutral)}
.dots i.on{background:var(--accent)}
.tile.full{background:var(--tint)}
.tile.full .gl .sk{stroke:var(--accent)}
.tile.full .cx .sk{stroke:var(--ghost)}

/* ---------- practice ---------- */
#practice{overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr) auto;--chrome:206px;animation:none}
.stage{display:grid;place-items:center;min-height:0;padding:6px 16px 10px}
#practice .pad{width:min(100vw - 32px,100vh - var(--chrome));width:min(100vw - 32px,100dvh - var(--chrome));touch-action:none}
#board{touch-action:none;cursor:crosshair}
.dock{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:6px 16px 16px;min-height:96px}
.word{display:inline-flex;align-items:center;gap:10px;min-width:0;justify-self:start;max-width:100%;height:60px;padding:0 20px 0 10px;border-radius:30px;background:var(--surface);box-shadow:var(--shadow-sm)}
.word .pic{font-size:28px;line-height:1;flex:none;width:44px;height:44px;border-radius:50%;background:var(--tint);display:grid;place-items:center}
.word .pic.many{width:auto;height:auto;background:none;font-size:15px;max-width:92px;line-height:1.25;letter-spacing:1px;padding-left:6px}
.word b{font-size:21px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:10px;align-items:center}
.fab{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--surface);box-shadow:var(--shadow)}
.fab svg{width:28px;height:28px}
.fab.alt{width:56px;height:56px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.fab.alt svg{width:24px;height:24px}
.steps{display:flex;gap:4px;padding:4px;border-radius:26px;background:var(--surface);box-shadow:var(--shadow-sm);margin:0 auto}
.step{width:54px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--muted);position:relative;transition:background .18s,color .18s}
.step svg{width:22px;height:22px}
.step[aria-current="step"]{background:var(--ink);color:var(--surface)}
.step.got::after{content:"";position:absolute;top:5px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--star);box-shadow:0 0 0 2px var(--surface)}
.step[aria-current="step"].got::after{box-shadow:0 0 0 2px var(--ink)}
#pGuide{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:.1 3.6}
#pProg,#pAnim{stroke:var(--accent)}
#pInk{stroke:var(--ink);stroke-width:2;opacity:.2;transition:opacity .35s}
#pInk.fade{opacity:0}
#gFree path{stroke:var(--ink);stroke-width:5}
#cueDot{fill:var(--accent);stroke:var(--surface);stroke-width:1.3;transform-box:fill-box;transform-origin:center}
#cuePulse{fill:none;stroke:var(--accent);stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:pulse 1.3s ease-out infinite}
#cueArrow{fill:var(--ink)}
#chalkTip{fill:var(--surface);stroke:var(--accent);stroke-width:1.4;opacity:0}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
.nudge #cueDot{animation:nudge .45s ease-in-out}
@keyframes nudge{50%{transform:scale(1.7)}}

.cheer{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:4px;z-index:3;
  background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:enter .25s ease}
.cheer h3{margin:0;font-size:clamp(34px,10vw,54px);line-height:1.25;font-weight:600}
.cheer .row{display:flex;gap:4px}
.cheer .row i{width:clamp(42px,12vw,64px);aspect-ratio:1;background:var(--star);
  clip-path:polygon(50% 3%,61% 35%,96% 37%,68% 58%,79% 92%,50% 72%,21% 92%,32% 58%,4% 37%,39% 35%);animation:pop .5s cubic-bezier(.2,1.6,.4,1) backwards}
.cheer .row i:nth-child(2){animation-delay:.14s}.cheer .row i:nth-child(3){animation-delay:.28s}
.cheer .acts{margin-top:18px}
@media (prefers-color-scheme:dark){.cheer{background:rgba(26,29,42,.84)}}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.bits{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.bits i{position:absolute;top:-20px;width:10px;height:15px;border-radius:3px;animation:fall 1.5s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}

@media (min-aspect-ratio:5/4){
  #practice{grid-template-rows:none;grid-template-columns:minmax(0,1fr) minmax(210px,30vw);--chrome:100px}
  #practice .pad{width:min(70vw - 48px,100vh - var(--chrome));width:min(70vw - 48px,100dvh - var(--chrome))}
  .dock{grid-template-columns:1fr;justify-items:center;align-content:center;gap:24px;padding:0 20px 20px 4px}
  .word{justify-self:center}
  .hero{grid-template-columns:auto auto;column-gap:7vw;text-align:left;justify-items:start;align-items:center;width:auto}
  .orb{grid-row:1/4;width:min(40vw,60vh,340px)}
  .hero h2{align-self:end;margin-top:0}
  .hero .cta{align-self:start}
}
@media (max-height:520px) and (min-aspect-ratio:5/4){:root{--hdr:54px}.round{width:40px;height:40px}#practice{--chrome:84px}.stage{padding-top:2px}}

/* ---------- parent ---------- */
#parent{-webkit-user-select:text;user-select:text}
.doc{max-width:640px;margin:0 auto;padding:4px 16px 40px;display:grid;gap:12px}
.card{background:var(--surface);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm)}
.card h2{font-size:19px;line-height:1.3;margin:0 0 8px;font-weight:600}
.card p{margin:6px 0;font-size:15.5px;color:var(--muted)}
.prow{display:grid;grid-template-columns:44px 1fr;gap:2px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .e{font-size:30px;line-height:1;grid-row:span 5;align-self:start;padding-top:4px}
.pm{display:grid;grid-template-columns:104px 1fr 58px;gap:8px;align-items:center;font-size:14.5px}
.pm div{height:8px;border-radius:4px;background:var(--neutral);overflow:hidden}
.pm div i{display:block;height:100%;background:var(--accent);border-radius:4px}
.pm span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;font-size:17px}
.sw{width:54px;height:32px;border-radius:16px;background:var(--neutral);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw[aria-checked="true"]{background:var(--brand)}.sw[aria-checked="true"]::after{left:25px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:999px;background:var(--neutral);font-size:15.5px}
.chip[aria-pressed="true"],.chip.go{background:var(--ink);color:var(--surface)}
.chip.warn{background:#D92D20;color:#fff}

/* ---------- print ---------- */
#sheet{display:none}
@media print{
  @page{size:A4;margin:12mm}
  html,body{height:auto;overflow:visible;background:#fff}
  #app,.bits{display:none!important}
  #sheet{display:block;color:#000;font-family:var(--bn)}
  #sheet h1{font-size:15pt;margin:0 0 4mm;display:flex;justify-content:space-between;font-weight:600}
  #sheet h1 small{font-weight:400;font-size:10pt}
  .wsrow{display:grid;grid-template-columns:repeat(5,34mm);gap:2mm;margin-bottom:3mm;break-inside:avoid;page-break-inside:avoid}
  .wsrow svg{width:34mm;height:34mm;border:.3mm solid #999;border-radius:2mm}
  .wsrow .cx path{stroke:#d5d5d5;stroke-width:6}
  .wsrow .m .gl path{stroke:#000;stroke-width:6}
  .wsrow .t .gl path{stroke:#8f8f8f;stroke-width:1.6;stroke-dasharray:.1 3.4}
}
@media (prefers-reduced-motion:reduce){
  #cuePulse,.cheer .row i,.nudge #cueDot,.screen,.cheer{animation:none}
  .bits{display:none}
  .press{transition:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="bar" id="bar">
    <button class="round press" id="back" aria-label="পিছনে"><svg viewBox="0 0 24 24" class="ic"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
    <h1 id="title"></h1>
    <div class="steps" id="steps" hidden>
      <button class="step" data-step="watch" aria-label="দেখো"><svg viewBox="0 0 24 24" class="ic"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.6"/></svg></button>
      <button class="step" data-step="trace" aria-label="দাগ বুলাও"><svg viewBox="0 0 24 24" class="ic"><path d="M9 11V4.8a1.7 1.7 0 013.4 0V10l5.2 1.3a2 2 0 011.5 2.2l-.7 4.7A3.3 3.3 0 0115.1 21h-3.3a3.3 3.3 0 01-2.6-1.3L5.4 14.8a1.6 1.6 0 012.4-2.1L9 13.8"/></svg></button>
      <button class="step" data-step="write" aria-label="নিজে লেখো"><svg viewBox="0 0 24 24" class="ic"><path d="M4 20l1-4.5L16.5 4a2.1 2.1 0 013 3L8 18.5 4 20z"/><path d="M14.5 6l3 3"/></svg></button>
    </div>
    <button class="round press" id="who" aria-label="কে লিখবে তা বদলাও"></button>
    <button class="round press" id="hear" aria-label="শোনো" hidden><svg viewBox="0 0 24 24" class="ic"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4.2 4.2 0 010 6M18 6.5a8 8 0 010 11"/></svg></button>
  </header>

  <main class="screen" id="home" hidden>
    <button class="gate press" id="gate" aria-label="অভিভাবকের জন্য: চেপে ধরে রাখুন">
      <svg class="ic" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/></svg><span id="gateTxt">অভিভাবক</span>
    </button>
    <div class="hero">
      <div class="orb"><div class="pad"><svg viewBox="0 0 100 100" id="heroSvg" aria-hidden="true"></svg></div></div>
      <h2>এসো লিখি</h2>
      <p>আঙুল দিয়ে বাংলা বর্ণ লিখি</p>
      <button class="cta press" id="play"><svg viewBox="0 0 24 24"><path d="M6 3.5v17a1 1 0 001.5.9l14-8.5a1 1 0 000-1.7l-14-8.5A1 1 0 006 3.5z" fill="currentColor"/></svg>শুরু করো</button>
    </div>
  </main>

  <main class="screen" id="pickwho" hidden><div class="wrap"><h2 class="lead">কে লিখবে?</h2><div class="pick" id="pick"></div></div></main>
  <main class="screen" id="levels" hidden><div class="wrap"><h2 class="lead">কী লিখবে?</h2><div class="levels" id="lvls"></div></div></main>
  <main class="screen" id="grid" hidden><div class="tiles" id="tiles"></div></main>

  <main class="screen" id="practice" hidden>
    <div class="stage">
      <div class="pad" id="pad">
        <svg viewBox="0 0 100 100" id="board" role="img">
          <g id="gCtx" class="cx"></g>
          <g id="gGhost" class="ghost"></g>
          <g id="gDone" class="done"></g>
          <path id="pGuide" class="sk"/>
          <path id="pProg" class="sk"/>
          <path id="pAnim" class="sk"/>
          <g id="gFree"></g>
          <path id="pInk" class="sk"/>
          <g id="gCue" hidden><circle id="cuePulse" r="4.2"/><circle id="cueDot" r="4.2"/><path id="cueArrow"/></g>
          <circle id="chalkTip" r="2.8"/>
        </svg>
      </div>
    </div>
    <div class="dock">
      <button class="word press" id="word" aria-label="শোনো"><span class="pic" id="pic"></span><b id="wtxt"></b></button>
      <div class="acts" id="acts"></div>
    </div>
  </main>

  <main class="screen" id="parent" hidden><div class="doc" id="doc"></div></main>
</div>
<div id="sheet"></div>
<noscript><p style="padding:24px">এই অ্যাপটি চালাতে জাভাস্ক্রিপ্ট চালু থাকতে হবে।</p></noscript>

<script>
"use strict";
/* ============ content ============ */

/* ============ strokes ============ */
const cache = new Map();
function resample(pts, step) {
  const out = [pts[0].slice()]; let need = step;

    let L = Math.hypot(bx-ax, by-ay);
    while (L >= need) { const t = need / L; ax += (bx-ax)*t; ay += (by-ay)*t; out.push([ax, ay]); L -= need; need = step; }
    need -= L;
  }
  const last = pts[pts.length-1];
  if (dist(last, out[out.length-1]) > .2) out.push(last.slice());
  return out;
}
const dOf = (pts, n = pts.length) => { let d = "M"; for (let i = 0; i < n; i++) d += (i ? "L" : "") + (+pts[i][0].toFixed(1)) + " " + (+pts[i][1].toFixed(1)); return n === 1 ? d + "h.01" : d; };
function strokesOf(key) {

  const list = (DATA[key] || []).map(s => {
    const pts = s.split(" ").map(p => p.split(",").map(Number));
    if (pts.length === 1) return {dot:true, rs:pts, d:dOf(pts), len:0};
    const rs = resample(pts, 1);
    return {dot:false, rs, d:dOf(pts), len:rs.length-1};
  });
  cache.set(key, list); return list;
}
const fill = (g, key) => { for (const st of strokesOf(key)) g.appendChild(sv("path", {d:st.d, class:"sk"})); return g; };

  return s;
}

let AC = null;

}
function tone(f, at, dur, vol, f2) {

  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || .16, t + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

}

/* ============ drawing animation (used by home, watch and hints) ============ */
function draw(list, o) {
  // Reveals each stroke in order. o.live = path that grows, o.tip = moving dot, o.into = group that keeps finished strokes.
  let i = 0;
  const next = () => {
    if (!o.alive()) return;
    if (i >= list.length) { if (o.tip) o.tip.style.opacity = 0; o.live.removeAttribute("d"); return o.done && o.done(); }
    const st = list[i], n = st.rs.length, dur = st.dot ? 260 : Math.max(380, st.len * (o.ms || 21)), t0 = performance.now();
    const frame = t => {
      if (!o.alive()) return;
      const f = Math.min(1, (t - t0) / dur), j = st.dot ? 0 : Math.max(1, Math.round(f * (n - 1)));
      o.live.setAttribute("d", dOf(st.rs, j + 1));
      if (o.tip) { o.tip.style.opacity = 1; o.tip.setAttribute("cx", st.rs[j][0]); o.tip.setAttribute("cy", st.rs[j][1]); }
      if (f < 1) return requestAnimationFrame(frame);
      if (o.into) o.into.appendChild(sv("path", {d:st.d, class:"sk"}));
      o.live.removeAttribute("d"); i++;
      setTimeout(next, o.gap == null ? 240 : o.gap);
    };
    requestAnimationFrame(frame);
  };
  next();
}

{
  const b = $("#board");

          free:$("#gFree"), cue:$("#gCue"), dot:$("#cueDot"), pulse:$("#cuePulse"), arrow:$("#cueArrow"), tip:$("#chalkTip")};
  b.addEventListener("pointerdown", ev => {

  });
  b.addEventListener("pointermove", ev => {
    if (ev.pointerId !== P.pid) { if (P.mode === "trace" && P.pid == null && ev.pointerId === P.held) P.carry(ev); return; }
    ev.preventDefault();
    if (P.mode === "trace") P.move(ev); else if (P.mode === "write") P.wmove(ev);
  });
  const end = ev => { if (ev.pointerId === P.held) P.held = null; if (ev.pointerId !== P.pid) return; if (P.mode === "trace") P.up(); else P.pid = null; };
  b.addEventListener("pointerup", end); b.addEventListener("pointercancel", end);
  b.addEventListener("contextmenu", ev => ev.preventDefault());
  document.querySelectorAll(".step").forEach(s => s.onclick = () => { if (!P.item) return; sfx.tap(); P.start(s.dataset.step); });

function toBox(ev) { const r = P.el.board.getBoundingClientRect(); return [(ev.clientX - r.left) / r.width * 100, (ev.clientY - r.top) / r.height * 100]; }
function confetti() {

  for (let i = 0; i < 26; i++) { const b = h("i"); b.style.left = Math.random() * 100 + "%"; b.style.background = cols[i % 5]; b.style.animationDelay = Math.random() * .5 + "s"; box.appendChild(b); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 2300);

  c = card("ওয়ার্কশিট ছাপুন");

  const bk = h("div", "seg"); c.appendChild(bk);

        for (const k in st) if (DATA[k] && st[k]) kids[a].stars[k] = {w:st[k].w ? 1 : 0, t:st[k].t ? 1 : 0, f:st[k].f ? 1 : 0}; }

function printSheet(l) {

    }

  }
